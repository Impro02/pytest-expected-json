name: CI

on:
  push:
    branches:
      - "main"
      - "develop"
    tags:
      - "*.*.*"
  pull_request:
    branches:
      - "**"
    types: [opened, synchronize, reopened, ready_for_review]

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync
      
      - name: Run Ruff
        run: uv run ruff format .

      - name: Run Ruff
        run: uv run ruff check .

  mypy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run mypy
        run: uv run mypy .

  tests:
    runs-on: ubuntu-latest
    needs: [ruff, mypy]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

  build-wheel:
    runs-on: ubuntu-latest
    needs: [ruff, mypy, tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Build wheel
        run: uv run hatch build -t wheel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-build
          path: dist/*.whl

  push-wheel:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-wheel]
    environment:
      name: pypi

    steps:
      - name: Download built wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-build
          path: dist

      - name: Validate SemVer tag (no prefix)
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag '${GITHUB_REF_NAME}'. Use SemVer, e.g. 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

      - name: Publish wheel to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
